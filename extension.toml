name = "EtherCAT"
version = "0.1.0"
description = "EtherCAT master on a dedicated network interface: scan slaves, trace every PDO by name, watch the working counter and AL states, and read or write CoE SDOs. Needs raw-frame access, such as CAP_NET_RAW and CAP_NET_ADMIN on Linux or Npcap on Windows; outputs stay off until enabled."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-ethercat"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["ethercat", "fieldbus", "industrial", "plc", "automation", "soem", "coe", "ethernet for control automation technology", "pysoem", "pdo", "process data", "sdo", "object dictionary", "al state", "working counter", "distributed clocks", "slave", "beckhoff", "ek1100", "el1004"]
categories = ["Industrial", "IoT", "Protocol", "Embedded", "Diagnostics", "Networking"]
icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

[package]
paths = ["LICENSE", "main.py", "zelos_extension_ethercat"]
