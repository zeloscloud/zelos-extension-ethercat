[project]
name = "zelos-extension-ethercat"
version = "0.1.0"
description = "EtherCAT master extension for Zelos: scan, process data, diagnostics and CoE"
authors = [{ name = "Zelos Cloud", email = "support@zeloscloud.io" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["zelos", "extension", "ethercat", "fieldbus", "industrial", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
dependencies = [
    # 0.0.13a1 floor, as the other agent extensions: standalone actions need the
    # at-rest harness, and a prerelease floor on the direct dep is what lets uv
    # resolve one.
    "zelos-sdk>=0.0.13a1",
    "rich-click>=1.8.0",
    # SOEM binding: prebuilt wheels for Linux x86_64/aarch64 (manylinux, musl), macOS
    # and Windows, so the install compiles nothing. Pinned: it carries SOEM itself.
    "pysoem==1.1.13",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-ethercat"
Repository = "https://github.com/zeloscloud/zelos-extension-ethercat"
Issues = "https://github.com/zeloscloud/zelos-extension-ethercat/issues"
Documentation = "https://docs.zeloscloud.io/extensions"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pre-commit>=4.3.0",
    "ruff>=0.14.2",
    "tomli>=2.3.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_ethercat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "B008",   # function call in defaults (common in decorators)
]

[tool.ruff.lint.pydocstyle]
convention = "google"
