[project]
name = "zelos-extension-ethercat"
version = "0.1.0"
description = "EtherCAT master on a dedicated network interface: scan slaves, trace every PDO by name, watch the working counter and AL states, and read or write CoE SDOs. Needs raw-frame access, such as CAP_NET_RAW and CAP_NET_ADMIN on Linux or Npcap on Windows; outputs stay off until enabled."
authors = [{ name = "Zelos", email = "support@zeloscloud.io" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["zelos", "extension", "ethercat", "fieldbus", "industrial", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "zelos-sdk>=0.0.13a1",
    "rich-click>=1.8.0",
    # Pinned: the master depends on this release's SOEM and GIL handling.
    "pysoem==1.1.13",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-ethercat"
Repository = "https://github.com/zeloscloud/zelos-extension-ethercat"
Issues = "https://github.com/zeloscloud/zelos-extension-ethercat/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_ethercat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "B008",   # function call in defaults (common in decorators)
]
